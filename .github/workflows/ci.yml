name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    name: check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # `prepare` runs tsup on install, so a failed build fails the gate here too.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint + format + typecheck
        run: pnpm run check

      - name: Tests
        run: pnpm test
